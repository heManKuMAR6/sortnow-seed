name: Release
# Publishes to npm only when a maintainer pushes a version tag (for example v0.2.0-alpha.1) that matches package.json AND a
# required reviewer approves the "npm" environment. Uses npm trusted publishing (OIDC) with provenance:
# no npm token is stored in this repository. Never triggered by merges.
# Node 22.23.4 bundles npm 10.9.9. Trusted publishing requires npm CLI >= 11.5.1 and Node >= 22.14.0
# (docs.npmjs.com/trusted-publishers). This job pins Node 22.23.4 and npm 11.21.2 (npm 11's current
# release; engines accept Node >= 22.9.0).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install npm 11.21.2 for trusted publishing
        run: |
          npm install -g npm@11.21.2
          test "$(npm -v)" = "11.21.2"
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Tag is on master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run smoke:install
      - run: npm audit --audit-level=high
      - run: npm publish --provenance
